<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapPay Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f5f8ff;
      --ink-soft: rgba(245, 248, 255, 0.74);
      --glass: rgba(255, 255, 255, 0.12);
      --edge: rgba(255, 255, 255, 0.32);
      --accent: #7fe3ff;
      --ok: #8bf0b8;
      --bad: #ffb3b3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow-x: hidden;
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background-color: #0a1030;
      background-image:
        radial-gradient(60vmax 60vmax at 12% 8%, rgba(58, 91, 255, 0.55), transparent 60%),
        radial-gradient(50vmax 50vmax at 92% 28%, rgba(25, 211, 232, 0.45), transparent 60%),
        radial-gradient(55vmax 55vmax at 28% 96%, rgba(176, 92, 255, 0.5), transparent 60%);
      background-attachment: fixed;
    }
    .app { max-width: 420px; margin: 0 auto; padding: 20px; }
    .glass {
      background: var(--glass); border: 1px solid var(--edge); border-radius: 28px;
      -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 12px 40px rgba(3, 8, 40, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.38);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass { background: rgba(30, 42, 100, 0.88); }
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; padding: 6px 4px 0; }
    h1 { font-size: 28px; margin: 26px 4px 6px; font-weight: 800; }
    .sub { margin: 0 4px 22px; color: var(--ink-soft); font-size: 16px; }
    .card { padding: 24px; margin-bottom: 16px; }
    .state { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; margin-bottom: 18px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff8a8a; }
    .dot.on { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(139, 240, 184, 0.6); } 50% { box-shadow: 0 0 0 8px rgba(139, 240, 184, 0); } }
    .primary {
      width: 100%; padding: 17px; border: none; border-radius: 18px; cursor: pointer;
      font: 800 18px "Manrope", system-ui, sans-serif; color: #06103a;
      background: linear-gradient(135deg, #7fe3ff, #9bb0ff); box-shadow: 0 8px 28px rgba(127, 227, 255, 0.35);
    }
    .secondary {
      width: 100%; padding: 15px; margin-top: 12px; border-radius: 18px; cursor: pointer; color: var(--ink);
      font: 600 16px "Manrope", system-ui, sans-serif; background: rgba(255,255,255,0.1); border: 1px solid var(--edge);
    }
    .last { text-align: center; padding: 28px 24px; margin-bottom: 16px; }
    .last .big { font-size: 44px; font-weight: 800; margin: 6px 0; }
    .last .small { color: var(--ink-soft); font-size: 15px; margin: 0; }
    .total { color: var(--ok); font-weight: 800; }
    ul { list-style: none; margin: 12px 0 0; padding: 0; }
    li { display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--edge); font-size: 16px; }
    li span:last-child { color: var(--ink-soft); }
    .note { color: var(--ink-soft); font-size: 14px; line-height: 1.5; margin: 14px 4px 0; }
    .bad { color: var(--bad); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M13 2 23 10 13 24 3 10Z" fill="rgba(127,227,255,0.35)" stroke="#bff1ff" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M3 10h20M13 2l-4 8 4 14 4-14-4-8" stroke="#bff1ff" stroke-width="1" stroke-linejoin="round" opacity="0.7"/>
      </svg>
      TapPay Shop
    </div>

    <h1>Ravi's Tea Stall</h1>
    <p class="sub">Keep this page open. It speaks every payment you receive.</p>

    <div class="glass card">
      <div class="state"><span id="dot" class="dot"></span><span id="state">Not listening</span></div>
      <button id="toggle" class="primary" onclick="toggleListening()">Start listening</button>
      <button class="secondary" onclick="simulate()">Simulate a payment (demo)</button>
    </div>

    <div class="glass last">
      <p class="small">Last payment</p>
      <p id="lastAmount" class="big">None yet</p>
      <p class="small">Total today: <span id="total" class="total">$0</span></p>
    </div>

    <div class="glass card">
      <strong>Recent payments</strong>
      <ul id="list"></ul>
    </div>

    <p id="note" class="note">Turn your phone volume up. If you hear nothing, check that silent mode is off.</p>
  </div>

  <script>
    // Person A's server link goes here later, for example 'https://tappay-server.onrender.com'
    const SERVER_URL = '';
    const SHOP_ID = 'shop_001';

    let listening = false;
    let timer = null;
    let sum = 0;
    const seen = new Set();

    const stateEl = document.getElementById('state');
    const dotEl = document.getElementById('dot');
    const toggleEl = document.getElementById('toggle');
    const noteEl = document.getElementById('note');

    function showNote(text, bad) {
      noteEl.textContent = text;
      noteEl.classList.toggle('bad', !!bad);
    }

    // Shows any hidden error on the page
    window.addEventListener('error', (e) => showNote('Error: ' + e.message, true));

    function speak(text) {
      if (!('speechSynthesis' in window)) {
        showNote("This browser can't speak. Try Chrome.", true);
        return;
      }
      try {
        const synth = window.speechSynthesis;
        if (synth.speaking || synth.pending) synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const voices = synth.getVoices();
        const v = voices.find(x => x.lang === 'en-IN') || voices.find(x => x.lang && x.lang.startsWith('en'));
        if (v) u.voice = v;
        u.lang = (v && v.lang) || 'en-IN';
        u.rate = 0.95;
        u.onerror = (ev) => showNote('Voice error: ' + ev.error, true);
        setTimeout(() => { synth.resume(); synth.speak(u); }, 80);
      } catch (e) {
        showNote('Voice error: ' + e.message, true);
      }
    }

    function announce(amount) {
      sum += amount;
      document.getElementById('lastAmount').textContent = '$' + amount + ' received';
      document.getElementById('total').textContent = '$' + sum;

      const li = document.createElement('li');
      const left = document.createElement('span');
      left.textContent = '$' + amount;
      const right = document.createElement('span');
      right.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      li.append(left, right);
      document.getElementById('list').prepend(li);

      showNote('Announced: ' + amount + ' dollars received');
      speak(amount + ' dollars received');
    }

    function toggleListening() {
      listening = !listening;
      dotEl.classList.toggle('on', listening);
      stateEl.textContent = listening ? 'Listening for payments' : 'Not listening';
      toggleEl.textContent = listening ? 'Stop listening' : 'Start listening';
      if (listening) {
        speak('Listening for payments');
        if (SERVER_URL) timer = setInterval(poll, 2000);
      } else {
        clearInterval(timer);
      }
    }

    function simulate() {
      if (!listening) {
        showNote('Press "Start listening" first, then simulate a payment.', true);
        return;
      }
      const amounts = [10, 25, 40, 60, 120, 250];
      announce(amounts[Math.floor(Math.random() * amounts.length)]);
    }

     // Asks the server for this shop's payments. Payments that already exist when you
    // press "Start listening" are not announced, only new ones.
    let firstPoll = true;
    async function poll() {
      try {
        const r = await fetch(SERVER_URL.replace(/\/+$/, '') + '/api/payments/new?shop=' + SHOP_ID);
        const data = await r.json();
        (data.payments || []).forEach(p => {
          const pid = p.id || p.payment_id;
          if (pid === undefined || seen.has(pid)) return;
          seen.add(pid);
          if (!firstPoll) announce(Number(p.amount));
        });
        firstPoll = false;
        if (listening) stateEl.textContent = 'Listening for payments';
      } catch (e) {
        stateEl.textContent = "Can't reach the server";
      }
    }
  </script>
</body>
</html>
