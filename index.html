<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TapPay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #f5f8ff;
      --ink-soft: rgba(245, 248, 255, 0.74);
      --glass: rgba(255, 255, 255, 0.12);
      --glass-strong: rgba(255, 255, 255, 0.22);
      --edge: rgba(255, 255, 255, 0.32);
      --accent: #7fe3ff;
      --ok: #8bf0b8;
      --bad: #ffb3b3;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow-x: hidden;
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background-color: #0a1030;
      background-image:
        radial-gradient(60vmax 60vmax at 12% 8%, rgba(58, 91, 255, 0.55), transparent 60%),
        radial-gradient(50vmax 50vmax at 92% 28%, rgba(25, 211, 232, 0.45), transparent 60%),
        radial-gradient(55vmax 55vmax at 28% 96%, rgba(176, 92, 255, 0.5), transparent 60%);
      background-attachment: fixed;
    }
    .app {
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    /* Glass surface */
    .glass {
      background: var(--glass);
      border: 1px solid var(--edge);
      border-radius: 28px;
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      box-shadow: 0 12px 40px rgba(3, 8, 40, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.38);
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass { background: rgba(30, 42, 100, 0.88); }
    }

    /* Brand */
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; padding: 6px 4px 0; }

    /* Screens */
    .screen { display: none; flex: 1; flex-direction: column; }
    .screen.active { display: flex; }
    .center { justify-content: center; }

    /* Home */
    .hero { margin-top: 28px; }
    .hero h1 { font-size: 30px; line-height: 1.15; margin: 0 0 8px; font-weight: 800; }
    .hero p { margin: 0; color: var(--ink-soft); font-size: 16px; line-height: 1.5; max-width: 30ch; }
    .stage { position: relative; display: grid; place-items: center; height: 320px; margin: 10px 0; }
    .ring {
      position: absolute; width: 190px; height: 190px; border-radius: 50%;
      border: 1.5px solid rgba(127, 227, 255, 0.55);
      animation: ripple 3.6s ease-out infinite;
      pointer-events: none;
    }
    .ring:nth-child(2) { animation-delay: 1.2s; }
    .ring:nth-child(3) { animation-delay: 2.4s; }
    @keyframes ripple {
      from { transform: scale(0.95); opacity: 0.7; }
      to   { transform: scale(1.5);  opacity: 0; }
    }
    .orb {
      position: relative; z-index: 1; width: 190px; height: 190px; border-radius: 50%;
      border: 1px solid var(--edge); color: var(--ink);
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.12) 55%, rgba(127, 227, 255, 0.18));
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
      box-shadow: 0 16px 50px rgba(20, 40, 160, 0.55), inset 0 2px 0 rgba(255, 255, 255, 0.6), inset 0 -10px 30px rgba(127, 227, 255, 0.2);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      font: 800 22px "Manrope", system-ui, sans-serif; cursor: pointer;
      transition: transform 0.15s ease;
    }
    .orb:active { transform: scale(0.96); }

    /* Buttons */
    .ghost {
      align-self: center; display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 26px; border-radius: 999px; color: var(--ink);
      font: 600 16px "Manrope", system-ui, sans-serif; cursor: pointer; margin-bottom: 18px;
    }
    .primary {
      width: 100%; padding: 17px; border: none; border-radius: 18px; cursor: pointer;
      font: 800 18px "Manrope", system-ui, sans-serif; color: #06103a;
      background: linear-gradient(135deg, #7fe3ff, #9bb0ff);
      box-shadow: 0 8px 28px rgba(127, 227, 255, 0.35);
    }
    .primary:active { transform: scale(0.98); }
    .link {
      align-self: flex-start; background: none; border: none; color: var(--ink-soft);
      font: 600 16px "Manrope", system-ui, sans-serif; padding: 14px 4px; cursor: pointer;
    }

    /* Pay card */
    .card { padding: 26px; margin-top: 8px; }
    .shop { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .avatar {
      width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
      background: var(--glass-strong); border: 1px solid var(--edge); font-weight: 800; font-size: 22px;
    }
    .shop h2 { margin: 0; font-size: 21px; font-weight: 800; }
    .verified { margin: 4px 0 0; display: flex; align-items: center; gap: 6px; color: var(--ok); font-size: 14px; font-weight: 600; }
    label { display: block; color: var(--ink-soft); font-size: 15px; margin-bottom: 8px; }
    .amount-wrap {
      display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-radius: 18px;
      background: rgba(255, 255, 255, 0.1); border: 1px solid var(--edge); margin-bottom: 8px;
    }
    .amount-wrap span { font-size: 30px; font-weight: 600; color: var(--ink-soft); }
    .amount-wrap input {
      width: 100%; background: none; border: none; outline: none; color: var(--ink);
      font: 800 38px "Manrope", system-ui, sans-serif;
    }
    .amount-wrap input::placeholder { color: rgba(245, 248, 255, 0.35); }
    .amount-wrap input::-webkit-outer-spin-button, .amount-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .amount-wrap input { -moz-appearance: textfield; }
    .err { min-height: 22px; margin: 0 0 14px; color: var(--bad); font-size: 14px; }

    /* Success */
    .done { text-align: center; padding: 34px 26px; }
    .done h2 { margin: 18px 0 6px; font-size: 26px; font-weight: 800; }
    .done p { margin: 0 0 26px; color: var(--ink-soft); font-size: 17px; line-height: 1.5; }
    .check path { stroke-dasharray: 44; stroke-dashoffset: 44; }
    .screen.active .check path { animation: draw 0.6s 0.15s ease forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .amount-wrap:focus-within { border-color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
      .check path { stroke-dashoffset: 0 !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M13 2 23 10 13 24 3 10Z" fill="rgba(127,227,255,0.35)" stroke="#bff1ff" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M3 10h20M13 2l-4 8 4 14 4-14-4-8" stroke="#bff1ff" stroke-width="1" stroke-linejoin="round" opacity="0.7"/>
      </svg>
      TapPay
    </div>

    <!-- Home -->
    <section id="home" class="screen active">
      <div class="hero">
        <h1>Pay with a tap</h1>
        <p>Hold your phone near the shop's tag.</p>
      </div>
      <div class="stage">
        <span class="ring"></span><span class="ring"></span><span class="ring"></span>
        <button class="orb" onclick="show('pay')" aria-label="Tap to pay">
          <svg width="76" height="76" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path d="M22 18c5 8 5 20 0 28" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M32 12c8 12 8 28 0 40" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
            <path d="M42 6c11 16 11 36 0 52" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
          </svg>
          Tap
        </button>
      </div>
      <button class="ghost glass">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
          <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="14" width="3" height="3" fill="currentColor"/>
          <rect x="18" y="18" width="3" height="3" fill="currentColor"/>
          <rect x="18" y="14" width="3" height="2" fill="currentColor"/>
          <rect x="14" y="19" width="2" height="2" fill="currentColor"/>
        </svg>
        Scan QR instead
      </button>
    </section>

    <!-- Pay -->
    <section id="pay" class="screen">
      <button class="link" onclick="show('home')">&#8249; Back</button>
      <div class="glass card">
        <div class="shop">
          <div class="avatar">R</div>
          <div>
            <h2>Ravi's Tea Stall</h2>
            <p class="verified">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M4.8 8.2l2.2 2.2 4.2-4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Verified shop
            </p>
          </div>
        </div>
        <label for="amount">Amount</label>
        <div class="amount-wrap">
          <span>&#8377;</span>
          <input id="amount" type="number" inputmode="decimal" min="0" placeholder="0">
        </div>
        <p id="err" class="err" role="alert"></p>
        <button id="payBtn" class="primary" onclick="pay()">Pay</button>
      </div>
    </section>

    <!-- Success -->
    <section id="success" class="screen center">
      <div class="glass card done">
        <svg class="check" width="72" height="72" viewBox="0 0 72 72" fill="none" aria-hidden="true">
          <circle cx="36" cy="36" r="33" stroke="#8bf0b8" stroke-width="3" opacity="0.5"/>
          <path d="M22 37l10 10 18-21" stroke="#8bf0b8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h2>Payment sent</h2>
        <p id="msg"></p>
        <button class="primary" onclick="reset()">Done</button>
      </div>
    </section>
  </div>

  <script>
    const amountInput = document.getElementById('amount');
    const payBtn = document.getElementById('payBtn');
    const err = document.getElementById('err');

    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      err.textContent = '';
    }
    amountInput.addEventListener('input', () => {
      err.textContent = '';
      payBtn.textContent = amountInput.value ? 'Pay \u20B9' + amountInput.value : 'Pay';
    });
    function pay() {
      const amount = amountInput.value;
      if (!amount || Number(amount) <= 0) {
        err.textContent = 'Enter an amount to pay.';
        return;
      }
      document.getElementById('msg').textContent = 'Paid \u20B9' + amount + " to Ravi's Tea Stall";
      show('success');
    }
    function reset() {
      amountInput.value = '';
      payBtn.textContent = 'Pay';
      show('home');
    }
  </script>
</body>
</html>
